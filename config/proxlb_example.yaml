proxmox_api:
  hosts: ['virt01.example.com', '10.10.10.10', 'fe01:bad:code::cafe']
  user: root@pam
  pass: crazyPassw0rd!
  # API Token method
  # token_id: proxlb
  # token_secret: 430e308f-1337-1337-beef-1337beefcafe
  ssl_verification: True
  timeout: 10
  # API Connection retries
  # retries: 1
  # wait_time: 1

proxmox_cluster:
  maintenance_nodes: ['virt66.example.com']
  maintenance_nodes_schedule:
    duration: 3                       # Duration in hours after the configured schedule start
    pre-migration: 10                 # Start maintenance this many minutes before the configured schedule
    schedules:
      virt77.example.com:
        - 'Monday, 8:00'
  ignore_nodes: []
  overprovisioning: True

balancing:
  enable: True
  enforce_affinity: False
  enforce_pinning: False
  parallel: False
  # If running parallel job, you can define
  # the amount of prallel jobs (default: 5)
  parallel_jobs: 1
  live: True
  with_local_disks: True
  with_conntrack_state: True
  cpu_overcommit: 2.0                 # Maximum ratio of vCPUs to physical cores per node
  max_node_inflow: 1                  # Maximum number of VMs that may be migrated onto any single node per run
  balance_types: ['vm', 'ct']         # 'vm' | 'ct'
  max_job_validation: 1800            # Maximum time (in seconds) a job validation may take
  memory_threshold: 75                # Optional: Maximum threshold (in percent) to trigger balancing actions
  cpu_threshold: 75                   # Optional: Maximum threshold (in percent) to trigger balancing actions
  balanciness: 5                      # Maximum delta of resource usage between highest and lowest usage node
  method: memory                      # 'memory' | 'cpu' | 'disk'
  mode: used                          # 'assigned' | 'used' | 'psi'
  balance_larger_guests_first: False  # Option to prioritize balancing of larger or smaller guests first
  node_resource_reserve:              # Optional: Define resource reservations for nodes (in GB)
    defaults:                         # Default reservation values applying to all nodes (unless explicitly overridden)
      memory: 4                       # Default: 4 GB memory reserved per node
    node01:                           # Specific node reservation override for node 'node01'
      memory: 6                       # Specific: 6 GB memory reserved for node 'node01'
  # # PSI thresholds only apply when using mode 'psi'
  # psi:
  #   nodes:
  #     memory:
  #       pressure_full: 0.20
  #       pressure_some: 0.20
  #       pressure_spikes: 1.00
  #     cpu:
  #       pressure_full: 0.20
  #       pressure_some: 0.20
  #       pressure_spikes: 1.00
  #     disk:
  #       pressure_full: 0.20
  #       pressure_some: 0.20
  #       pressure_spikes: 1.00
  #   guests:
  #     memory:
  #       pressure_full: 0.20
  #       pressure_some: 0.20
  #       pressure_spikes: 1.00
  #     cpu:
  #       pressure_full: 0.20
  #       pressure_some: 0.20
  #       pressure_spikes: 1.00
  #     disk:
  #       pressure_full: 0.20
  #       pressure_some: 0.20
  #       pressure_spikes: 1.00
  pools:                              # Optional: Define affinity/anti-affinity rules per pool
    dev:                              # Pool name: dev
      type: affinity                  # Type: affinity (keeping VMs together)
    de-nbg01-db:                      # Pool name: de-nbg01-db
      type: anti-affinity             # Type: anti-affinity (spreading VMs apart)
      pin:                            # Define a pinning og guests to specific node(s)
        - virt66
        - virt77
      strict: False                   # Disable strict mode of node pinning for this pool

service:
  daemon: True
  enable_ha: True                     # Run ProxLB in HA mode using shared state in Proxmox cluster (requires Proxmox VE 8.4+)
  schedule:
    interval: 12
    format: hours
  delay:
    enable: False
    time: 1
    format: hours
  log_level: INFO

# Optional: CP-SAT solver integration (requires proxlb-solver package)
# Install with: pip install proxlb-solver
# See docs/04_solver.md for full documentation.
# solver:
#   enable: False                   # Set to True to activate the solver
#   mode: shadow                    # 'shadow' (observe only) | 'active' (solver drives migrations)
#   log_dir: /var/log/proxlb/solver # Directory for JSONL run logs and HTML reports
#   timeout_seconds: 30             # CP-SAT wall-clock time limit per solve (seconds)
#   use_reservations: True          # Apply node_resource_reserve entries as hard constraints
#   active_step_retries: 3          # Max re-solve attempts on migration failure (active mode only)
#   fallback_to_greedy: True        # Fall back to greedy Balancing() when the solver cannot place VMs (active mode only)
